name: proveit-tests
version: 0.1.0
description: >-
  Flags recognizable ways an agent weakens tests to reach green: removed or loosened asserts,
  skip/xfail/.only, deleted tests, expected literals rewritten to match failing
  output, assert True / tautologies, try/except pass wrappers, and test-runner
  escape hatches (pytest || true, -k "not …", --deselect, --passWithNoTests,
  CI continue-on-error), and pytest config / conftest.py narrowing (addopts
  -k/-m/--deselect/--ignore, testpaths, collect_ignore, deselecting hooks). Net-new only: each edit is compared with the file
  as it was before, so pre-existing skips are not blamed on the edit.
  Deterministic AST + regex — no LLM. Modes: observe
  (default), escalate to the human-approval gate, or block on unattended/cron
  runs. Durable SHA-256 receipts and a /proveit ledger. Python-strong;
  JS/TS coverage is heuristic and limited. Disclosure (rule 13): local-only,
  reads edited test, CI, pytest-config and conftest.py files and tool args to compare before/after; appends
  warnings into tool results; may escalate or block tool calls when configured.
  Ledger is written only under the Hermes plugin data dir (in-memory if none;
  never /tmp); terminal findings keep a short, secret-redacted command excerpt
  locally.
  Not a sandbox and not unbypassable — an agent can still rewrite via shell,
  disable the plugin, or invent new weakenings. Complements core verify-on-stop
  and claim-vs-evidence plugins; does not certify compliance. No findings is
  not proof that tests were preserved.
author: ProveIt
license: MIT
requires_hermes: ">=0.22.7"
provides_tools: []
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - pre_verify
  - on_session_start
  - on_session_end
provides_commands:
  - proveit
config_schema:
  mode:
    type: str
    default: observe
    description: "observe | escalate | block_unattended (block only when cron/unattended; otherwise escalate)"
    required: false
  test_path_globs:
    type: list
    default:
      - "**/test_*.py"
      - "**/*_test.py"
      - "**/tests/**/*.py"
      - "**/*.test.js"
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.spec.js"
      - "**/*.spec.ts"
      - "**/*.spec.tsx"
      - "**/__tests__/**"
    description: "Globs treated as test files"
    required: false
  ci_path_globs:
    type: list
    default:
      - ".github/workflows/**"
      - ".gitlab-ci.yml"
      - "azure-pipelines*.yml"
      - "Jenkinsfile"
      - ".circleci/**"
    description: "CI config paths watched for continue-on-error / allow_failure weakenings"
    required: false
  receipt_dir:
    type: str
    default: ""
    description: "Optional relative subdirectory for the receipt ledger, confined under the Hermes plugin data dir (absolute or escaping paths are rejected)"
    required: false
  one_shot_nudge:
    type: bool
    default: true
    description: "When true, pre_verify nudges once per turn if unexplained weakenings remain"
    required: false
