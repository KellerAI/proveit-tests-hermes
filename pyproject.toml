[project]
name = "proveit-tests"
version = "0.1.0"
description = "Hermes plugin that catches agents weakening tests"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ProveIt" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["proveit_tests", "__init__.py"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
