[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proveit-tests"
version = "0.2.0"
description = "A green test run your agent did not fake."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ProveIt" }]

[tool.setuptools.packages.find]
include = ["proveit_tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["proveit_tests", "__init__.py"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
