# Copy to .github/workflows/proveit-check.yml and set the full commit SHA.
name: ProveIt test integrity
on: [pull_request]

permissions:
  contents: read

concurrency:
  group: proveit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proveit-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Inspect changes against the base branch
        env:
          BASE: ${{ github.base_ref }}
          PROVEIT_SHA: "REPLACE_WITH_FULL_40_CHARACTER_SHA"
        run: |
          python -m pip install "proveit-tests @ git+https://github.com/KellerAI/proveit-tests-hermes.git@$PROVEIT_SHA"
          cd "$RUNNER_TEMP"
          python -I -m proveit_tests.ci --base "origin/$BASE" --head "$GITHUB_SHA" --repo "$GITHUB_WORKSPACE" --format github
